name: affilio-agent-poc
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: affilio_poc
      POSTGRES_USER: affilio
      POSTGRES_PASSWORD: affilio_local_poc
    ports:
      - "127.0.0.1:55440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affilio -d affilio_poc"]
      interval: 2s
      timeout: 3s
      retries: 20
