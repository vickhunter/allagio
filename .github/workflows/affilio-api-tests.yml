name: Affilio API Tests

on:
  push:
    paths:
      - "affilio-api/**"
      - ".github/workflows/affilio-api-tests.yml"
  pull_request:
    paths:
      - "affilio-api/**"
      - ".github/workflows/affilio-api-tests.yml"

jobs:
  test:
    name: affilio-api-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: affilio_test
          POSTGRES_USER: affilio
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U affilio -d affilio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      AFFILIO_TEST_DATABASE_URL: postgresql://affilio:password@localhost:5432/affilio_test
      COVERAGE_MIN: "25"
    defaults:
      run:
        working-directory: affilio-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: affilio-api/go.mod
          cache: true
          cache-dependency-path: |
            affilio-api/go.mod
            affilio-api/go.sum

      - name: Run CI tests
        run: make ci-test

      - name: Vet Go source
        run: go vet ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: affilio-api-coverage
          path: affilio-api/coverage.out
