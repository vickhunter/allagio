name: Affilio API Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "affilio-api/**"
      - "affilio-wp/admin/build/workspace*"
      - "affilio-wp/admin/build/home.html"
      - "affilio-wp/admin/build/landing*"
      - "affilio-wp/admin/build/setup-controls.js"
      - "affilio-wp/admin/build/package*.json"
      - "affilio-wp/e2e/workspace.mjs"
      - "Dockerfile.mvp"
      - ".github/workflows/affilio-api-tests.yml"
  pull_request:
    paths:
      - "affilio-api/**"
      - "affilio-wp/admin/build/workspace*"
      - "affilio-wp/admin/build/home.html"
      - "affilio-wp/admin/build/landing*"
      - "affilio-wp/admin/build/setup-controls.js"
      - "affilio-wp/admin/build/package*.json"
      - "affilio-wp/e2e/workspace.mjs"
      - "Dockerfile.mvp"
      - ".github/workflows/affilio-api-tests.yml"

jobs:
  test:
    name: affilio-api-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: affilio_test
          POSTGRES_USER: affilio
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U affilio -d affilio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      AFFILIO_TEST_DATABASE_URL: postgresql://affilio:password@localhost:5432/affilio_test
      AFFILIO_MIGRATION_TEST_DATABASE_URL: postgresql://affilio:password@localhost:5432/affilio_migration_test
      COVERAGE_MIN: "25"
    defaults:
      run:
        working-directory: affilio-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: affilio-api/go.mod
          cache: true
          cache-dependency-path: |
            affilio-api/go.mod
            affilio-api/go.sum

      - name: Create isolated migration database
        run: PGPASSWORD=password psql -h localhost -U affilio -d postgres -c 'CREATE DATABASE affilio_migration_test'

      - name: Run CI tests
        run: make ci-test

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build landing illustration
        working-directory: affilio-wp/admin/build
        run: npm ci --ignore-scripts && npm run build

      - name: Install workspace browser
        working-directory: affilio-wp/e2e
        run: npm install && npx playwright install --with-deps chromium

      - name: Verify workspace in Chromium
        env:
          AFFILIO_WORKSPACE_BROWSER: '1'
        run: go test ./internal/handlers -run TestWorkspaceBrowser -count=1

      - name: Vet Go source
        run: go vet ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: affilio-api-coverage
          path: affilio-api/coverage.out
