name: Onboarding Tests

on:
  push:
    paths: ["packages/distributoor-setup/**", "distributoor-plugin/skills/**", "affilio-wp/**", ".github/workflows/onboarding-tests.yml"]
  pull_request:
    paths: ["packages/distributoor-setup/**", "distributoor-plugin/skills/**", "affilio-wp/**", ".github/workflows/onboarding-tests.yml"]

jobs:
  onboarding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test builder setup
        working-directory: packages/distributoor-setup
        run: npm test
      - name: Verify distributable package
        working-directory: packages/distributoor-setup
        run: npm pack --dry-run
      - name: Check WordPress PHP
        run: find affilio-wp -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test WordPress setup
        run: php affilio-wp/tests/onboarding.php
