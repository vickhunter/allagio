name: ORP protocol

on:
  push:
    paths:
      - "docs/protocol/**"
      - ".github/workflows/orp-protocol.yml"
  pull_request:
    paths:
      - "docs/protocol/**"
      - ".github/workflows/orp-protocol.yml"

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/protocol/package-lock.json
      - name: Conformance suite
        working-directory: docs/protocol
        run: npm ci && npm test
