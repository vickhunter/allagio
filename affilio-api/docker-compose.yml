version: "3.8"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: affilio
      POSTGRES_USER: affilio
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - affilio_pg:/var/lib/postgresql/data
  api:
    build: .
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://affilio:password@db:5432/affilio
      API_KEY_SECRET: dev-secret
    ports:
      - "8080:8080"
    depends_on:
      - db
volumes:
  affilio_pg:
